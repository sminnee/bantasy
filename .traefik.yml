displayName: bantasy
type: middleware

import: github.com/sminnee/bantasy

summary: Block requests by IP, path, user-agent and referrer rules read from JSONL files, with fail2ban-style trap bans.

testData:
  files:
    - /etc/bantasy/static/static.jsonl
    - /etc/bantasy/dynamic/dynamic.jsonl
  reloadSeconds: 10
  statusCode: 403
  body: ""
  clientIpHeader: X-Real-Ip
  logBlocks: true
  trapBanSeconds: 28800
  trapBanMax: 10000
